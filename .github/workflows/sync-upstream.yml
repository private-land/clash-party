name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: smart_core
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/mihomo-party-org/mihomo-party.git || true
          git fetch upstream --tags

      - name: Check for new tag
        id: check
        run: |
          # Get latest upstream tag
          UPSTREAM_TAG=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          UPSTREAM_LATEST=$(git ls-remote --tags upstream | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          echo "Current latest tag: $UPSTREAM_TAG"
          echo "Upstream latest tag: $UPSTREAM_LATEST"
          echo "upstream_tag=$UPSTREAM_LATEST" >> $GITHUB_OUTPUT

          # Check if upstream has a newer tag
          if [ "$UPSTREAM_TAG" != "$UPSTREAM_LATEST" ] && [ -n "$UPSTREAM_LATEST" ]; then
            echo "has_new_tag=true" >> $GITHUB_OUTPUT
            echo "New tag detected: $UPSTREAM_LATEST"
          else
            echo "has_new_tag=false" >> $GITHUB_OUTPUT
            echo "No new tag from upstream"
          fi

          BRANCH_NAME="sync-upstream-$UPSTREAM_LATEST"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create sync branch and merge
        if: steps.check.outputs.has_new_tag == 'true'
        run: |
          git checkout -b ${{ steps.check.outputs.branch_name }}
          git merge ${{ steps.check.outputs.upstream_tag }} --no-edit || true

      - name: Push sync branch
        if: steps.check.outputs.has_new_tag == 'true'
        run: |
          git push origin ${{ steps.check.outputs.branch_name }} --force

      - name: Create Pull Request
        if: steps.check.outputs.has_new_tag == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.check.outputs.branch_name }}
          base: smart_core
          title: 'chore: sync with upstream ${{ steps.check.outputs.upstream_tag }}'
          body: |
            Automated PR to sync with upstream [mihomo-party-org/mihomo-party](https://github.com/mihomo-party-org/mihomo-party).

            **Upstream tag:** ${{ steps.check.outputs.upstream_tag }}

            Please review and resolve any conflicts manually if present.
          labels: |
            sync
            automated
